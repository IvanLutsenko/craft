
<section class="slide" data-slide-layout="pair">
  <div class="pad">
    <p class="slide-title">{{SLIDE_TITLE}}</p>
    <div class="code-windows code-windows--pair">
      <figure class="code-window">
        <figcaption class="code-window-bar"><i></i><i></i><i></i><span>{{LEFT_LABEL}}</span></figcaption>
        {{LEFT_CONTENT}}
      </figure>
      <figure class="code-window frag">
        <figcaption class="code-window-bar"><i></i><i></i><i></i><span>{{RIGHT_LABEL}}</span></figcaption>
        {{RIGHT_CONTENT}}
      </figure>
    </div>
    <p class="type-note frag">{{FINDING}}</p>
  </div>
  <p class="slide-number"></p>
</section>
