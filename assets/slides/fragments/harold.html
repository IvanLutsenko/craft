<section class="slide s-harold" data-slide-layout="harold">
  <div class="pad">
    <figure class="harold-plate">
      {{HAROLD_IMAGE}}
      <figcaption><span class="harold-line harold-line--top">{{TOP_LINE}}</span> <span class="harold-line harold-line--bottom">{{BOTTOM_LINE}}</span></figcaption>
    </figure>
    <div class="harold-side">
      <p class="byline">{{AUTHOR}}</p>
      {{QR_LINK}}
    </div>
  </div>
  <p class="slide-number"></p>
</section>
